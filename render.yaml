# Despliegue gratuito en Render.com (un solo servicio).
# Express sirve la API y el frontend estático desde el MISMO origen: 1 URL, sin CORS.
# La BD SQLite es efímera en el plan free; por eso se migra y se re-siembra en cada
# arranque (start:prod), así la demo siempre tiene datos.
services:
  - type: web
    name: kda-gota
    runtime: node
    plan: free
    rootDir: KDA_back
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # URL que se codifica dentro de los QR impresos. Ajústala si cambias el
      # nombre del servicio, o los stickers apuntarán a un dominio muerto.
      - key: APP_URL
        value: https://kda-gota.onrender.com
      # OJO: valor fijo a propósito, NUNCA generateValue. Los códigos QR se
      # derivan de este salt; si cambiara en cada deploy, todas las etiquetas ya
      # pegadas en los bebederos dejarían de resolver.
      - key: QR_SALT
        value: kda-gota-qr
      # Cuenta inicial del panel. El registro público está cerrado, así que sin
      # esto no hay forma de entrar. sync: false = Render la pide al desplegar y
      # la guarda en el panel, no queda escrita en el repo.
      - key: ADMIN_EMAIL
        value: admin@pucp.edu.pe
      - key: ADMIN_PASSWORD
        sync: false
      # PORT lo inyecta Render automáticamente; app.js lo respeta (PORT || 3000).
